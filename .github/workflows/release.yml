name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint and test
        run: |
          ruff check .
          python train.py
          pytest -v

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build --label org.opencontainers.image.source=https://github.com/${{ github.repository }} -t $IMAGE .

      - name: Smoke test container
        run: |
          docker run -d --name app -p 8080:80 $IMAGE
          curl -f --retry 15 --retry-connrefused --retry-delay 1 http://localhost:8080/health
          curl -s http://localhost:8080/health | grep "$GITHUB_REF_NAME"
          curl -f -X POST http://localhost:8080/predict -H "Content-Type: application/json" -d '{"age": 0.02, "sex": -0.044, "bmi": 0.06, "bp": -0.03, "s1": -0.02, "s2": 0.03, "s3": -0.02, "s4": 0.02, "s5": 0.02, "s6": -0.001}'
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/predict -H "Content-Type: application/json" -d '{"age": 0.02}')
          test "$status" = "422"
          docker cp app:/app/metrics.json metrics.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: docker push $IMAGE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: metrics.json